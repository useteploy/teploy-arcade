<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>game-serv-soft — phase 0.3 console demo</title>
<style>
  :root { color-scheme: dark; }
  body { background: #111; color: #ddd; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; }
  h1 { font-size: 1rem; font-weight: 600; color: #9fe; margin: 0 0 1rem; }
  #status { font-size: 0.8rem; color: #888; margin-bottom: 1rem; }
  #status.connected { color: #6f6; }
  #status.disconnected { color: #f66; }
  #console { background: #000; padding: 1rem; height: 60vh; overflow-y: auto; border: 1px solid #333; white-space: pre-wrap; word-break: break-all; }
  #console .drop { color: #f93; }
  form { display: flex; gap: .5rem; margin-top: 1rem; }
  input[type=text] { flex: 1; background: #000; color: #ddd; border: 1px solid #333; padding: .5rem; font: inherit; }
  button { background: #333; color: #ddd; border: 1px solid #444; padding: .5rem 1rem; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<h1>console — server:1</h1>
<div id="status" class="disconnected">disconnected</div>
<div id="console"></div>
<form id="f">
  <input id="cmd" type="text" placeholder="type a command, e.g. say hi — sent to agent, NOT echoed to other viewers" autocomplete="off">
  <button>Send</button>
</form>
<script>
const consoleEl = document.getElementById('console');
const statusEl = document.getElementById('status');
const form = document.getElementById('f');
const cmdEl = document.getElementById('cmd');
const append = (line, cls) => {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = line;
  consoleEl.appendChild(d);
  consoleEl.scrollTop = consoleEl.scrollHeight;
};
let paused = false;
consoleEl.addEventListener('scroll', () => {
  const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 4;
  paused = !atBottom;
});
const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/console');
ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.className = 'connected'; };
ws.onclose = () => { statusEl.textContent = 'disconnected'; statusEl.className = 'disconnected'; append('[disconnected]', 'drop'); };
ws.onmessage = (e) => { append(e.data); };
form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (cmdEl.value.trim()) { ws.send(cmdEl.value); cmdEl.value = ''; }
});
</script>
</body>
</html>
