version: 2

project_name: teploy-arcade

before:
  hooks:
    - go mod tidy

builds:
  - id: teploy-arcade
    main: ./cmd/teploy-arcade
    binary: teploy-arcade
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    # No version in the file name, deliberately. GitHub only serves
    # /releases/latest/download/<name> for an exact name, so embedding the
    # version means the install line in README.md cannot be copied without
    # editing it - and a first command that 404s is precisely the failure the
    # unpublished ghcr image already made once.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
