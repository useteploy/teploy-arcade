name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable: the release workflow calls this job so a tag cannot publish
  # binaries or an image from a commit that has not passed the same checks
  # main runs.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      # The panel mutates server state from runner goroutines while HTTP
      # handlers read it, and the detector has found real races on Server.Status
      # more than once. It is not optional here.
      - run: go test -race ./...
      # The frontend is plain files served from the binary, so its guards are a
      # dependency-free Node scripts rather than a frontend build framework.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test-frontend
