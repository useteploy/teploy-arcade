name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # A tag must publish only a verified commit: the release and image jobs used
  # to run independently of every check main enforces, so a tagged commit that
  # failed vet, the race suite or the frontend test shipped anyway.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Reject reused release versions and tag drift
        run: python3 .github/scripts/release-guard.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish an image only after binary publication succeeds; scan the exact
  # locally loaded image and push it without a second build.
  image:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the same immutable source tag as the binary release
        run: python3 .github/scripts/release-guard.py --identity-only
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/useteploy/teploy-arcade
          # R69 (audit pass 7): `latest` moves only on stable releases. The
          # old raw rule `enable=!is_prerelease` passed a literal the action's
          # parser rejects (it requires exactly true/false after expression
          # expansion), which threw before ANY tag was produced - stable
          # included. flavor latest=auto is the action's own semver-driven
          # policy: semver tags get latest, prereleases do not.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Scan the exact image before publishing its tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --exit-code 1 --severity HIGH,CRITICAL "$image"
      - name: Publish the scanned image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 .github/scripts/release-guard.py --identity-only
          while IFS= read -r image; do
            test -z "$image" || docker push "$image"
          done <<< "$IMAGE_TAGS"
